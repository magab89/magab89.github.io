<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PoC Sandbox</title>
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #5227cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --surface: #1f1e1c;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #34322f;
        --accent: #a58bff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
    .lede { color: var(--muted); margin: 0 0 40px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .poc a {
      display: grid;
      gap: 4px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s;
    }
    .poc a:hover { border-color: var(--accent); }
    .poc-title { font-weight: 600; font-size: 16px; }
    .poc-desc { color: var(--muted); }
    .poc-meta { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>PoC Sandbox</h1>
    <p class="lede">Small, throwaway proofs of concept. Static pages only, sample data only.</p>
    <ul>
      <!--POC_LIST-->
    </ul>
  </main>
</body>
</html>
